name: ci
on: [push, pull_request]
permissions:
  contents: read
# On master, a run in progress is never cancelled. A queued run can be replaced
# by a newer run, whose commit then carries the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: node bin/research-vault.mjs init --vault ./ci-vault
      - run: node bin/research-vault.mjs lint --vault ./ci-vault --check
      - run: node scripts/check-agentsmd-drift.mjs
      - run: node scripts/check-encoding.mjs
      - run: npm run lint:self
